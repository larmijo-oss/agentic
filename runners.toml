# ==============================================================================  
# BASEAPIs
# ==============================================================================  
[apis]  
# https://inference-docs.cerebras.ai/models/overview
cerebras = { url = "https://api.cerebras.ai", key = "CEREBRAS_API_KEY" }  
# https://console.groq.com/docs/models
groq = { url = "https://api.groq.com/openai", key = "GROQ_API_KEY" }
# https://console.groq.com/docs/models
huggingface = { url = "https://router.huggingface.co", key = "HUGGINGFACE_API_KEY" }
# https://docs.mistral.ai/api/endpoint/models#operation-list_models_v1_models_get
mistral = { url = "https://api.mistral.ai", key = "MISTRAL_API_KEY" }
# https://build.nvidia.com/models?filters=nimType%3Anim_type_preview
nvidia = { url = "https://integrate.api.nvidia.com", key = "NVIDIA_API_KEY" }
# https://opencode.ai/docs/zen/#endpoints
opencode = { url = "https://opencode.ai/zen", key = "OPENCODE_API_KEY" }
# low rate limit and variable model availability
openrouter = { url = "https://openrouter.ai/api", key = "OPENROUTER_API_KEY" }  
# http://localhost:11433; "" removes local, wrong port to trigger exhaustion
local = { url = "", key = "omlx" }
